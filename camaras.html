<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grandvalira | 8 cámaras</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07111d;color:#f7f9fc;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}header{min-height:58px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:10px 16px;background:#101d2c;border-bottom:1px solid #26384c}header strong{font-size:17px}header small{color:#b9c9d8}main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(270px,1fr));gap:7px;padding:7px;min-height:calc(100vh - 58px)}.cam{position:relative;min-width:0;min-height:0;background:#17283b;overflow:hidden;border-radius:5px}.cam h2{position:absolute;top:0;left:0;right:0;margin:0;padding:7px 10px;background:linear-gradient(#091624e8,#09162499);z-index:2;font-size:13px;font-weight:600;pointer-events:none}.cam iframe{width:100%;height:100%;border:0;background:#142338}.cam a{position:absolute;bottom:6px;right:8px;z-index:2;color:#fff;background:#091624b8;border-radius:3px;padding:4px 6px;font-size:11px;text-decoration:none}@media(max-width:1000px){main{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,minmax(220px,1fr))}.cam{height:34vh}}@media(max-width:550px){main{grid-template-columns:1fr;grid-template-rows:none}.cam{height:43vh}}.status{font-size:12px;color:#a8c4db;margin-right:12px}button{background:#243d55;color:#fff;border:1px solid #50718c;border-radius:4px;padding:7px 10px;cursor:pointer}</style></head><body><header><strong>GRANDVALIRA <span style="font-weight:400;color:#a6c9e7">| EN DIRECTO</span></strong><span><small>8 cámaras · Fuente: Grandvalira / Feratel</small> <span class="status" id="status">Cargando…</span> <button onclick="refreshAll()">Actualizar ahora</button> <button onclick="document.documentElement.requestFullscreen?.()">Pantalla completa</button></span></header><main id="cams"></main><script>const cameras=[['Encamp','15090'],['Canillo','15065'],['El Tarter','15045'],['Soldeu · Estadi Creand','15061'],['Soldeu · Espiolets','15060'],['Grau Roig','15050'],['Pas de la Casa · 2540 m','15056'],['Pas de la Casa · 2100 m','15055']];const root=document.querySelector('#cams');const REFRESH_MS=3*60*1000;let frames=[];let lastRefresh=0;function refreshAll(){lastRefresh=Date.now();frames.forEach(({frame,url},index)=>{const fresh=document.createElement('iframe');fresh.title=frame.title;fresh.allow=frame.allow;fresh.loading='eager';fresh.src=url+'&_refresh='+lastRefresh+'_'+index;frame.replaceWith(fresh);frames[index].frame=fresh});updateStatus()}function updateStatus(){const t=new Date(lastRefresh);const next=new Date(lastRefresh+REFRESH_MS);document.querySelector('#status').textContent='Recarga: '+t.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+' · Próxima: '+next.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}for(const [name,id] of cameras){const url='https://webtv.feratel.com/webtv/?c1=0&cam='+id+'&design=v5&lg=es';const section=document.createElement('section');section.className='cam';const title=document.createElement('h2');title.textContent=name;const frame=document.createElement('iframe');frame.src=url;frame.title='Webcam '+name;frame.allow='autoplay; fullscreen; encrypted-media; picture-in-picture';frame.setAttribute('loading','eager');const link=document.createElement('a');link.href=url;link.target='_blank';link.rel='noopener';link.textContent='Abrir cámara ↗';section.append(title,frame,link);root.append(section);frames.push({frame,url})}refreshAll();setInterval(refreshAll,REFRESH_MS);setInterval(updateStatus,30*1000);</script></body></html>
