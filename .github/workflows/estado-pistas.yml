name: Actualizar estado de pistas Grandvalira
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar fuente oficial
        run: python scripts/actualizar_estado_pistas.py
      - name: Guardar solo si cambió el parte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/estado-pistas.json
          git diff --cached --quiet || (git commit -m "data: actualizar parte de Grandvalira" && git push)
