<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desde el refugio · Soldeu y El Tarter</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script defer src="./grandvalira-incles.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#eff5f7;color:#102d39;font:15px system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:12px} h1{font-size:1.25rem;margin:0 0 10px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px}
button{font:inherit;font-weight:650;color:inherit;background:white;border:1px solid #9ab2ba;border-radius:8px;padding:8px;cursor:pointer}
#map{height:clamp(290px,66dvh,700px);border-radius:10px;background:#dae9ea}
#map:fullscreen{width:100%;height:100%;border-radius:0}
#report,#legend{margin:7px 0;font-size:.84rem} .photo{display:block;width:170px;max-width:100%;border-radius:6px;margin-top:7px}
</style>
</head>
<body>
<main>
<h1>Desde el refugio · Soldeu y El Tarter</h1>
<div class="tools">
<button type="button" id="locate">Localizar mi alojamiento</button>
<button type="button" id="overview">Ver ambos sectores</button>
<button type="button" id="expand">Pantalla completa ⛶</button>
</div>
<div id="map" aria-label="Mapa del alojamiento, las pistas y los remontes"></div>
<p id="legend">Verde · Abierto | Rojo · Cerrado | Ámbar · Otro estado | Gris · Sin confirmar. Línea discontinua · Remonte.</p>
<p id="report" role="status">Cargando el mapa y el parte…</p>
</main>
</body>
</html>
